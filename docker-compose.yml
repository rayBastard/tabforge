services:
  tabforge:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # demucs/basic-pitch models download here on first use (~50 MB);
      # the named volume keeps them across container recreation
      - model-cache:/home/tabforge/.cache
    environment:
      # overridable from the host env: TABFORGE_TOKEN=... docker-compose up
      TABFORGE_TOKEN: "${TABFORGE_TOKEN:-}"       # set to require an API token
      TABFORGE_WORKERS: "${TABFORGE_WORKERS:-1}"
      TABFORGE_MAX_UPLOAD_MB: "${TABFORGE_MAX_UPLOAD_MB:-200}"
      TABFORGE_MAX_DURATION_S: "${TABFORGE_MAX_DURATION_S:-600}"
      TABFORGE_JOB_TTL_S: "${TABFORGE_JOB_TTL_S:-7200}"
      TABFORGE_MAX_JOBS: "${TABFORGE_MAX_JOBS:-20}"

  # Public access via Cloudflare quick tunnel (no account, no public IP):
  #   TABFORGE_TOKEN=<secret> docker compose --profile tunnel up -d
  # The public URL appears in this container's logs. NEVER expose the
  # server without TABFORGE_TOKEN set.
  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://tabforge:8000
    depends_on:
      - tabforge
    restart: unless-stopped
    profiles: ["tunnel"]

volumes:
  model-cache:
