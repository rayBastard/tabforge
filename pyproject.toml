[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tabforge"
version = "0.7.0"
description = "Audio (Suno and beyond) -> tablature and sheet music"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
# The core has no dependencies — tests and CI fly
dependencies = []

[project.optional-dependencies]
eval = ["mir_eval>=0.7"]
# High-quality separation backend (BS-Roformer-SW): measurably cleaner
# stems on the eval stand, ~30x slower than demucs on CPU
roformer = ["bs-roformer-infer>=0.1.5"]
# Optional f0 tracker for the monophonic path (MIT code AND weights,
# bundled in the wheel — no runtime downloads); pyin is the free base
crepe = ["torchcrepe>=0.0.24"]
# Synced lyrics from the vocal stem (faster-whisper, MIT; the model
# downloads from HF on first use, ~460 MB for "small")
lyrics = ["faster-whisper>=1.2"]
# The ml extra needs Python <= 3.11: basic-pitch 0.4.0 requires
# tensorflow(-macos) < 2.15.1 on Python 3.12+, which was never released.
# On macOS use Python 3.11 (basic-pitch runs on the CoreML backend there).
ml = [
    "basic-pitch>=0.4.0",
    "demucs>=4.0.1",
    "librosa>=0.10.1",
    "numpy<2.0",
    # instrument identification of separated stems (PANNs CNN14);
    # optional at runtime — tagging degrades gracefully without it
    "panns-inference>=0.1.1",
    # resampy 0.4.2 (pulled in by basic-pitch) imports pkg_resources at
    # runtime but does not declare setuptools; pip >= 26 no longer ships
    # setuptools in fresh venvs, and setuptools >= 81 dropped pkg_resources.
    "setuptools<81",
]
export = [
    "PyGuitarPro>=0.9.3",
    "pretty_midi>=0.2.10",
    "music21>=9.1.0",
]
server = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]
desktop = ["pywebview>=5.0"]
all = ["tabforge[ml,export,server,desktop]"]

[project.scripts]
tabforge = "tabforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
